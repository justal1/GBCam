<!doctype html><body style="margin:0;background:#222"><pre id=o style="color:#0f0;font:12px monospace;margin:0"></pre><iframe id=f src="index.html" width=420 height=900 style="border:0"></iframe><script>
const L=t=>{document.getElementById('o').textContent+=t+'\n';fetch('http://127.0.0.1:8802/log?'+encodeURIComponent(t)).catch(()=>{})};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('f').onload=async()=>{try{await sleep(900);const w=document.getElementById('f').contentWindow,d=w.document;
 d.getElementById('tabzx').click();await sleep(2500);const ZX=w.eval('ZX');const sp=()=>ZX.spec;
 const get=async n=>new w.File([await (await fetch('testroms/zx/'+n)).arrayBuffer()],n);
 const rowText=()=>{const a=sp().mem;let s='';for(let r=0;r<24;r++){let line='';for(let c=0;c<32;c++){let x=0;const ch=[];for(let y=0;y<8;y++)ch.push(a[0x4000|(((r*8+y)&0xC0)<<5)|(((r*8+y)&7)<<8)|(((r*8+y)&0x38)<<2)|c]);line+=ch.some(v=>v)?'#':'.'}s+=line.indexOf('#')>=0?'x':''}return s.length};
 L('start: ROM line = "'+d.getElementById('zxromname').textContent+'"');
 // 1. single-ROM zip (deflate, nested path)
 const romText=()=>{const m=sp().mem;for(let i=0;i<0x4000;i++)if(m[i]===0x32&&m[i+1]===0x30&&m[i+2]===0x32&&m[i+3]===0x36)return String.fromCharCode(...m.slice(i,i+25));return 'not found'};
 await ZX.openFile(await get('single_rom.zip'));await sleep(1500);L('after single_rom.zip: '+d.getElementById('zxromname').textContent+' | ROM text: '+romText());
 L('copyright text on the Spectrum screen changed: ' + (()=>{let n=0;for(let i=0;i<6144;i++)n+=sp().mem[0x4000+i]?1:0;return n>0})());
 L('stored localStorage ROM: '+!!w.localStorage.getItem('catcam-zxrom'));
 // 2. reload page keeps the ROM
 // 3. original ROM
 d.getElementById('zxorig').click();await sleep(1500);L('after "Use original ROM": '+d.getElementById('zxromname').textContent+' | stored='+!!w.localStorage.getItem('catcam-zxrom'));
 // 4. stored zip with a tape
 await ZX.openFile(await get('stored_tap.zip'));await sleep(500);L('stored_tap.zip -> '+d.getElementById('zxtape').textContent);
 // 5. multi zip -> picker dialog; choose the tape row and the z80 row
 await ZX.openFile(await get('multi.zip'));await sleep(500);const rows=[...d.querySelectorAll('#zxpick .zxitem')];L('picker rows: '+rows.map(r=>r.textContent.replace(/\s+/g,' ').trim()).join(' | '));
 rows.find(r=>/border\.z80/.test(r.textContent)).querySelector('button').click();await sleep(1500);L('after loading border.z80 snapshot: border colour = '+sp().border+' (expect 2) pc='+sp().cpu.pc.toString(16));
 await ZX.openFile(await get('multi.zip'));await sleep(500);[...d.querySelectorAll('#zxpick .zxitem')].find(r=>/hi\.tap/.test(r.textContent)).querySelector('button').click();await sleep(500);L('tape from multi.zip: '+d.getElementById('zxtape').textContent);
 // run the tiny tape: LOAD "" then RUN prints HI
 sp().reset();for(let i=0;i<100;i++)sp().runFrame();await ZX.typeKeys([['J'],['SYM','P'],['SYM','P'],['ENTER']]);await sleep(1500);await ZX.typeKeys([['R'],['ENTER']]);await sleep(2500);L('screen has text after RUN: '+(()=>{let n=0;for(let i=0;i<6144;i++)n+=sp().mem[0x4000+i]?1:0;return n})()+' pixel bytes');
 // 6. snapshot round trip
 const sna=w.eval('ZXFiles').saveSna(sp());L('sna size '+sna.length+' (expect 49179)');
 await ZX.openFile(new w.File([sna],'snap.sna'));await sleep(500);L('sna reloaded ok; pc='+sp().cpu.pc.toString(16));
 // 7. error handling
 await ZX.openFile(new w.File([new Uint8Array(100)],'junk.zip'));await sleep(300);L('junk zip toast: "'+(d.getElementById('toast')||{}).textContent+'"');
 await ZX.openFile(new w.File([new Uint8Array(1000)],'bad.rom'));await sleep(300);L('bad ROM toast: "'+(d.getElementById('toast')||{}).textContent+'"');
 L('DONE')}catch(e){L('FATAL '+e.message+'\n'+e.stack)}};
</script></body>
