<!doctype html><base href="../"><body style="background:#222;color:#0f0;font:12px monospace"><pre id=o></pre>
<script src="gb.js"></script><script>
(()=>{
 const L=t=>{document.getElementById('o').textContent+=t+'\n';fetch('http://127.0.0.1:8802/log?'+encodeURIComponent(t)).catch(()=>{})};
 let fails=0;const ok=(n,c,d='')=>{if(!c)fails++;L((c?'PASS ':'FAIL ')+n+(d?' '+d:''))};
 const mk=(type,banks=8,ramSize=2,cgb=0,code=null)=>{const r=new Uint8Array(banks*16384);r[0x147]=type;r[0x148]=Math.log2(banks)-1;r[0x149]=ramSize;r[0x143]=cgb;for(let b=0;b<banks;b++)r[b*16384+0x3FFF]=b;
  if(code){r[0x100]=0xC3;r[0x101]=0x50;r[0x102]=0x01;r.set(code,0x150)}return r};
 // --- MBC2 ---
 {const g=new GameBoy(mk(5,16,0));g.wr(0x0000,0x0A);g.wr(0xA000,0xAB);ok('MBC2 ram 4-bit, upper nibble 1s',g.rd(0xA000)===0xFB,g.rd(0xA000).toString(16));
  g.wr(0xA1FF,0x03);ok('MBC2 echo ram',g.rd(0xA3FF)===0xF3);g.wr(0x2100,5);ok('MBC2 rom bank via bit8',g.rd(0x7FFF)===5);g.wr(0x2100,0);ok('MBC2 bank 0 -> 1',g.rd(0x7FFF)===1);
  g.wr(0x0100,0x00);ok('MBC2 bit8 write does not disable ram',g.rd(0xA000)===0xFB);g.wr(0x0000,0);ok('MBC2 ram disable',g.rd(0xA000)===0xFF)}
 // --- MBC3 + RTC ---
 {const real=Date.now;let now=1700000000000;Date.now=()=>now;const g=new GameBoy(mk(0x10,16,3));g.loadRtc();g.wr(0x0000,0x0A);g.wr(0x4000,0x08);g.wr(0xA000,30);g.wr(0x4000,0x09);g.wr(0xA000,10);g.wr(0x4000,0x0A);g.wr(0xA000,5);
  now+=65000;g.wr(0x6000,0);g.wr(0x6001,1);g.wr(0x4000,8);ok('RTC seconds after 65s',g.rd(0xA000)===35,String(g.rd(0xA000)));g.wr(0x4000,9);ok('RTC minutes roll',g.rd(0xA000)===11,String(g.rd(0xA000)));g.wr(0x4000,0x0A);ok('RTC hours',g.rd(0xA000)===5);
  now+=86400*3*1000;g.wr(0x6000,0);g.wr(0x6001,1);g.wr(0x4000,0x0B);ok('RTC days',g.rd(0xA000)===3,String(g.rd(0xA000)));
  g.wr(0x4000,0x0C);g.wr(0xA000,0x40);now+=50000;g.wr(0x6000,0);g.wr(0x6001,1);g.wr(0x4000,8);const frozen=g.rd(0xA000);now+=50000;g.wr(0x6000,0);g.wr(0x6001,1);ok('RTC halt freezes',g.rd(0xA000)===frozen);
  g.wr(0x4000,0);g.wr(0xA000,0x77);ok('MBC3 normal ram still works',g.rd(0xA000)===0x77);
  g.wr(0x4000,0x0C);g.wr(0xA000,0);const g2=new GameBoy(mk(0x10,16,3));g2.sram.set(g.sram);g2.loadRtc();ok('RTC survives save/load',g2.rtc.secs===g.rtc.secs&&g2.rtc.stamp===g.rtc.stamp);Date.now=real}
 // --- MBC5 + rumble ---
 {const g=new GameBoy(mk(0x1E,16,3));let ev=[];g.onRumble=o=>ev.push(o);g.wr(0x0000,0x0A);g.wr(0x4000,0x0B);ok('MBC5 rumble bit callback',ev.length===1&&ev[0]===true);ok('rumble keeps ram bank 3',g.ramBank===3);g.wr(0x4000,0x03);ok('rumble off event',ev[1]===false);
  g.wr(0x2000,0x07);ok('MBC5 rom bank',g.rd(0x7FFF)===7)}
 {const g=new GameBoy(mk(0x1B,16,3));g.wr(0x4000,0x0F);ok('plain MBC5 uses 4 bit ram bank',g.ramBank===15)}
 // --- HuC1 ---
 {const g=new GameBoy(mk(0xFF,16,2));g.wr(0x0000,0x0E);ok('HuC1 IR mode read 0xC0',g.rd(0xA000)===0xC0);g.wr(0x0000,0x0A);g.wr(0xA000,0x42);ok('HuC1 ram',g.rd(0xA000)===0x42);g.wr(0x2000,6);ok('HuC1 rom bank',g.rd(0x7FFF)===6)}
 // --- HuC3 ---
 {const g=new GameBoy(mk(0xFE,16,3));g.wr(0x0000,0x0A);g.wr(0xA000,0x99);ok('HuC3 ram rw',g.rd(0xA000)===0x99);g.wr(0x0000,0x0D);ok('HuC3 semaphore ready',g.rd(0xA000)===1);g.wr(0x2000,9);ok('HuC3 rom bank',g.rd(0x7FFF)===9)}
 // --- CGB banks / palettes / HDMA ---
 {const g=new GameBoy(mk(0x00,2,0,0x80));ok('CGB mode on for flag 0x80',g.cgb===true);ok('boot A=0x11',g.a===0x11);
  g.wr(0xFF4F,1);g.wr(0x8000,0xAA);g.wr(0xFF4F,0);g.wr(0x8000,0x55);ok('VRAM banks separate',g.rd(0x8000)===0x55);g.wr(0xFF4F,1);ok('VRAM bank1',g.rd(0x8000)===0xAA);ok('VBK readback',g.rd(0xFF4F)===0xFF);
  g.wr(0xFF70,2);g.wr(0xD000,0x22);g.wr(0xFF70,3);g.wr(0xD000,0x33);g.wr(0xC000,0x11);g.wr(0xFF70,2);ok('WRAM bank 2',g.rd(0xD000)===0x22);g.wr(0xFF70,3);ok('WRAM bank 3',g.rd(0xD000)===0x33);ok('WRAM bank 0 fixed',g.rd(0xC000)===0x11);g.wr(0xFF70,0);ok('SVBK 0 maps to 1',g.wbank===1);
  g.wr(0xFF68,0x80);g.wr(0xFF69,0x1F);g.wr(0xFF69,0x00);g.wr(0xFF69,0xE0);g.wr(0xFF69,0x03);ok('BG palette auto-increment red',g.bgRGB[0]===0xFF0000FF||g.bgRGB[0]===(0xFF000000|0xFF),g.bgRGB[0].toString(16));ok('BG colour 1 green',((g.bgRGB[1]>>8)&255)===255,g.bgRGB[1].toString(16));
  g.wr(0xFF6A,0x80);g.wr(0xFF6B,0xFF);g.wr(0xFF6B,0x7F);ok('OBJ palette white',g.obRGB[0]===0xFFFFFFFF);
  for(let i=0;i<64;i++)g.wr(0xC000+i,i+1);g.wr(0xFF4F,0);g.wr(0xFF51,0xC0);g.wr(0xFF52,0x00);g.wr(0xFF53,0x00);g.wr(0xFF54,0x00);g.wr(0xFF55,0x03);let good=true;for(let i=0;i<64;i++)if(g.rd(0x8000+i)!==i+1)good=false;ok('general HDMA copies 64 bytes',good);ok('HDMA5 reads idle',g.rd(0xFF55)===0xFF);
  g.wr(0xFF51,0xC0);g.wr(0xFF52,0x00);g.wr(0xFF53,0x01);g.wr(0xFF54,0x00);g.wr(0xFF55,0x81);ok('HBlank HDMA armed (2 blocks)',g.rd(0xFF55)===0x01,g.rd(0xFF55).toString(16));g.hdmaStep();ok('one block per HBlank',g.rd(0xFF55)===0x00);g.hdmaStep();ok('HBlank HDMA done',g.rd(0xFF55)===0xFF);ok('HDMA data landed',g.rd(0x8100)===1&&g.rd(0x811F)===32)}
 // --- DMG-only game stays DMG; force-DMG option ---
 {const g=new GameBoy(mk(0x00,2,0,0x00));ok('flag 0 -> DMG',g.cgb===false);const h=new GameBoy(mk(0x00,2,0,0x80),{mode:'dmg'});ok('forced DMG mode',h.cgb===false);const c=new GameBoy(mk(0x00,2,0,0xC0));ok('CGB-only flag 0xC0 -> CGB',c.cgb===true)}
 // --- double speed via STOP, measured ---
 const spd=(sw)=>{const code=[0x3E,1,0xE0,0x4D,0x10,0x00,0xF0,0x4D,0xEA,0x00,0xC0,0x11,0,0,0x13,0x18,0xFD];const nosw=[0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x11,0,0,0x13,0x18,0xFD];
  const g=new GameBoy(mk(0x00,2,0,0x80,sw?code:nosw));for(let i=0;i<10;i++)g.runFrame();const de0=g.de;for(let i=0;i<5;i++)g.runFrame();return {inc:(g.de-de0+65536)%65536,key1:g.rd(0xC000),dbl:g.dbl}};
 {const a=spd(false),b=spd(true);ok('STOP switches to double speed',b.dbl===true&&b.key1===0xFE,JSON.stringify(b));ok('double speed runs ~2x the instructions per frame',b.inc/a.inc>1.9&&b.inc/a.inc<2.1,(b.inc/a.inc).toFixed(3));
  const g=new GameBoy(mk(0x00,2,0,0x80,[0x3E,1,0xE0,0x4D,0x10,0x00,0x18,0xFE]));for(let i=0;i<5;i++)g.runFrame();const f0=g.frames;for(let i=0;i<60;i++)g.runFrame();ok('frame length unchanged in double speed (60 frames = 60 frames)',g.frames-f0===60)}
 L(fails?('FAILURES: '+fails):'ALL PASS');L('DONE');
})();</script></body>
