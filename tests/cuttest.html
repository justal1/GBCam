<!doctype html><base href="../"><body><pre id=o style="color:#0f0;font:12px monospace"></pre><iframe id=f src="index.html" width=420 height=700 style="border:0"></iframe><script>
const L=t=>document.getElementById('o').textContent+=t+'\n';
document.getElementById('f').onload=async()=>{try{await new Promise(r=>setTimeout(r,900));const w=document.getElementById('f').contentWindow,d=w.document,Fx=w.eval('Fx');
 d.getElementById('tabfx').click();L('groups: '+[...d.querySelectorAll('#fxgrid .fxh')].map(e=>e.textContent).join(' | '));L('buttons: '+d.querySelectorAll('#fxgrid button').length);
 d.querySelector('#fxgrid button[data-k=cutout]').click();L('cutout panel hidden='+d.getElementById('fxcut').hidden);
 // key method with synthetic bg + person
 d.getElementById('cutmethod').value='key';d.getElementById('cutmethod').dispatchEvent(new Event('change'));
 const mk=(person)=>{const c=document.createElement('canvas');c.width=384;c.height=336;const x=c.getContext('2d');x.fillStyle='#6a9';x.fillRect(0,0,384,336);x.fillStyle='#888';for(let i=0;i<384;i+=32)x.fillRect(i,0,16,336);if(person){x.fillStyle='#d9a';x.beginPath();x.ellipse(192,170,70,110,0,0,7);x.fill();}return c};
 const run=(c)=>{const x=c.getContext('2d',{willReadFrequently:true});Fx.apply(x);return c};
 const CO=Fx.cutout;CO.capture=true;run(mk(false));L('ref captured: '+!!CO.ref);
 d.getElementById('cutbg').value='sticker';d.getElementById('cutbg').dispatchEvent(new Event('change'));
 const out=run(mk(true));out.style.cssText='background:#fff;border:1px solid #999;margin:4px';document.body.appendChild(out);
 d.getElementById('cutbg').value='dots';d.getElementById('cutbg').dispatchEvent(new Event('change'));const out2=run(mk(true));document.body.appendChild(out2);
 L('mask coverage: '+(Fx.lastMask?Fx.lastMask.reduce((a,b)=>a+b,0)/Fx.lastMask.length:'none'));
 // AI model load
 d.getElementById('cutmethod').value='ai';d.getElementById('cutmethod').dispatchEvent(new Event('change'));
 for(let i=0;i<40&&CO.mlState==='loading';i++)await new Promise(r=>setTimeout(r,500));
 L('ML state: '+CO.mlState+' | '+d.getElementById('cutstat').textContent);
 if(CO.mlState==='ready'){CO.lastRun=0;const c=mk(true);run(c);L('ML mask: '+(CO.mask?'yes '+CO.W+'x'+CO.H:'none'))}
 L('DONE');}catch(e){L('FATAL '+e.message+e.stack)}};
</script></body>
