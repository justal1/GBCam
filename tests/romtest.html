<!doctype html><base href="../"><body style="margin:0;background:#333;color:#0f0;font:12px monospace"><pre id=o></pre><div id=g></div>
<script src="gb.js"></script><script>
(async()=>{
 const q=new URLSearchParams(location.search),name=q.get('rom'),frames=+(q.get('frames')||600);
 const L=t=>{document.getElementById('o').textContent+=t+'\n';fetch('http://127.0.0.1:8802/log?'+encodeURIComponent(t)).catch(()=>{})};
 const rom=new Uint8Array(await (await fetch('testroms/'+name)).arrayBuffer());
 let gb;try{gb=new GameBoy(rom)}catch(e){L('CTOR ERR '+e.message);return}
 let out='';gb.printer.transfer=(b)=>{out+=String.fromCharCode(b);return 0xFF};
 try{const keys=(q.get('keys')||'').split(',').filter(Boolean);for(let f=0;f<frames;f++){gb.runFrame();for(const k of keys){const [fr,key]=k.split(':');if(f==+fr)gb.setKey(key,true);if(f==+fr+6)gb.setKey(key,false)}if(/Passed|Failed/.test(out)&&f>20&&f%30==0)break}}catch(e){L('RUN ERR '+e.stack)}
 L(name+' serial: '+JSON.stringify(out.slice(-400)));
 L('cgb? '+gb.cgb+' pc='+gb.pc.toString(16));
 const c=document.createElement('canvas');c.width=160;c.height=144;c.style.cssText='width:320px;image-rendering:pixelated';const x=c.getContext('2d'),im=x.createImageData(160,144);
 const P=[[255,255,255],[170,170,170],[85,85,85],[0,0,0]];
 for(let i=0;i<160*144;i++){let r,g,b;if(gb.cgb){const v=gb.fbc[i];r=v&255;g=(v>>8)&255;b=(v>>16)&255}else{const p=P[gb.fb[i]];r=p[0];g=p[1];b=p[2]}im.data.set([r,g,b,255],i*4)}
 x.putImageData(im,0,0);document.getElementById('g').appendChild(c);
 const ref=q.get('ref');if(ref){const img=new Image();img.src='testroms/'+ref;await img.decode();const rc=document.createElement('canvas');rc.width=160;rc.height=144;const rx=rc.getContext('2d');rx.drawImage(img,0,0);const rd=rx.getImageData(0,0,160,144).data;let bad=0,tol=+(q.get('tol')||24);
  const shade=v=>v>200?0:v>120?1:v>40?2:3;
  for(let i=0;i<160*144;i++){let ok;if(gb.cgb||q.get('rgb')){const dr=Math.abs(rd[i*4]-im.data[i*4]),dg=Math.abs(rd[i*4+1]-im.data[i*4+1]),db=Math.abs(rd[i*4+2]-im.data[i*4+2]);ok=dr<=tol&&dg<=tol&&db<=tol}else ok=shade(rd[i*4])===shade(im.data[i*4]);if(!ok)bad++}
  L('REF MISMATCH pixels: '+bad+' of '+160*144);document.getElementById('g').appendChild(img);img.style.cssText='width:320px;image-rendering:pixelated;margin-left:8px'}
 document.title='done';
})();</script></body>
