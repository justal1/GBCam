<!doctype html><base href="../"><body style="margin:0;background:#222;color:#fff;font:11px monospace"><iframe id=f src="index.html" width=420 height=700 style="border:0" allow="camera"></iframe><div id=o></div>
<script>
const f=document.getElementById('f');
const L=(...a)=>console.log('T:',...a), sleep=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{
 const w=f.contentWindow,d=w.document; await sleep(1200);
 const ev=s=>w.eval(s);
 const Fx=ev('Fx'),Ov=ev('Overlay'),Sh=ev('Shots'),Alb=ev('Album'),Prt=ev('Prt');
 // synthetic frame source (no camera in headless)
 let n=0;
 ev(`window.__n=0;grabVideo=function(){const k=++window.__n;wx.fillStyle='#8ec5ff';wx.fillRect(0,0,W,H);wx.fillStyle='#3c9a4a';wx.fillRect(0,250,W,86);
   wx.fillStyle='#f1c27d';wx.beginPath();wx.ellipse(192+((k*13)%40-20),150,58,72,0,0,7);wx.fill();wx.fillStyle='#5a3416';wx.beginPath();wx.ellipse(192+((k*13)%40-20),92,62,24,0,Math.PI,0);wx.fill();
   wx.fillStyle='#fff';wx.beginPath();wx.arc(170,140,12,0,7);wx.arc(214,140,12,0,7);wx.fill();wx.fillStyle='#222';wx.beginPath();wx.arc(170,143,5,0,7);wx.arc(214,143,5,0,7);wx.fill();
   Fx.apply(wx);Overlay.apply(wx);return toGray(wx.getImageData(0,0,W,H).data)}`);
 const view=d.getElementById('view');
 const tile=(name)=>{const c=document.createElement('canvas');c.width=160;c.height=140;c.getContext('2d').drawImage(view,0,0,160,140);const wr=document.createElement('div');wr.style.cssText='display:inline-block;margin:2px';wr.appendChild(c);wr.appendChild(document.createElement('br'));wr.appendChild(document.createTextNode(name));document.getElementById('o').appendChild(wr)};
 const frame=async(name,times=1)=>{for(let i=0;i<times;i++){const g=w.eval('grabVideo()');w.eval('render').call(w,g)}await sleep(30);tile(name)};
 const cfgSet=(id,v)=>{d.getElementById(id).value=v;d.getElementById(id).dispatchEvent(new Event('input'))};
 // 1. new dither modes
 cfgSet('look','mono');cfgSet('contrast','1.2');
 for(const m of ['halftone','lines','noise','bayer'])  {cfgSet('mode',m);await frame('mode '+m)}
 cfgSet('mode','gbcam');
 // 2. overlay
 Ov.st.frame='polaroid';Ov.st.caption='Best day ever';Ov.st.date=true;
 Ov.add('googly','');Ov.add('moustache','');Ov.add('emoji','🎩');Ov.st.stickers.push({t:'bubble',ch:'',anchor:'free',x:.5,y:.12,s:140,text:'Meow!'});
 await frame('overlay polaroid+stickers',3);
 for(const fr of ['film','rounded','gb','hearts']){Ov.st.frame=fr;await frame('frame '+fr)}
 Ov.st.frame='none';Ov.st.caption='';Ov.st.date=false;Ov.st.stickers.length=0;
 // 3. glitch filters (stateful: several frames)
 cfgSet('look','cdith');
 for(const k of ['scanlines','rgbsplit','vhs','edges','echo','ghost','rainbow']){Fx.st.name=k;await frame('fx '+k,4)}
 Fx.st.name='none';cfgSet('look','mono');
 // 4. strip via mock printer
 d.getElementById('mock').checked=true;
 d.getElementById('shotmode').value='strip3';
 await w.eval('Shots.strip(3)');
 L('strip rows',w.eval('window.lastStrip.h'),'modal open',!d.getElementById('modal').hidden);
 const before=w.catcam.mock.sent.length;
 const btns=[...d.querySelectorAll('#modalbody button')];L('modal buttons',btns.map(b=>b.textContent).join('|'));
 btns[0].click();await sleep(2500);L('strip packets',w.catcam.mock.sent.length-before);
 btns[2].click();await sleep(800);L('album after save frames',Alb.all.length);
 // 5. calibration + label
 const cal=Prt.calibration();L('calibration rows',cal.h);
 d.getElementById('calprev').click();await sleep(100);
 const calc=d.querySelector('#modalbody canvas');const cc=document.createElement('canvas');cc.width=calc.width;cc.height=calc.height;cc.getContext('2d').drawImage(calc,0,0);cc.style.cssText='width:192px;image-rendering:pixelated';document.getElementById('o').appendChild(cc);
 d.getElementById('modal').hidden=true;
 d.getElementById('lbltext').value='Hello from CatCam!\nSecond line';d.getElementById('lblprev').click();await sleep(100);
 const lc=d.querySelector('#modalbody canvas');const lcc=document.createElement('canvas');lcc.width=lc.width;lcc.height=lc.height;lcc.getContext('2d').drawImage(lc,0,0);lcc.style.cssText='width:192px;image-rendering:pixelated;background:#fff';document.getElementById('o').appendChild(lcc);
 d.getElementById('modal').hidden=true;
 const b2=w.catcam.mock.sent.length;d.getElementById('lblprint').click();await sleep(1500);L('label packets',w.catcam.mock.sent.length-b2);
 // 6. album: select, fav, zip validity, print queue, batch import
 const ids=Alb.all.map(s=>s.id);L('album size',ids.length);
 d.getElementById('albsel').click();await sleep(100);
 d.querySelectorAll('#gallery .it')[0].click();await sleep(100);d.querySelectorAll('#gallery .it')[1].click();await sleep(100);
 L('selected label',d.getElementById('selcount').textContent);
 d.getElementById('selfav').click();await sleep(300);L('favs',(await w.eval('dbAll()')).filter(s=>s.fav).length);
 const b3=w.catcam.mock.sent.length;d.getElementById('selprint').click();await sleep(3500);L('queue packets',w.catcam.mock.sent.length-b3);
 const z=Alb.zip([{name:'a.txt',data:new TextEncoder().encode('hello')},{name:'b/x.bin',data:new Uint8Array([1,2,3,4,5])}]);
 L('ZIP64',btoa(String.fromCharCode(...z)));
 const k=document.createElement('canvas');k.width=300;k.height=200;const kx=k.getContext('2d');kx.fillStyle='#e33';kx.fillRect(0,0,300,200);kx.fillStyle='#fff';kx.fillRect(100,50,100,100);
 const blob=await new Promise(r=>k.toBlob(r,'image/png'));const dt=new w.DataTransfer();dt.items.add(new w.File([blob],'a.png',{type:'image/png'}));dt.items.add(new w.File([blob],'b.png',{type:'image/png'}));
 const inp=d.getElementById('batchfile');inp.files=dt.files;inp.dispatchEvent(new Event('change'));await sleep(2000);L('album after batch',Alb.all.length);
 // 7. clip
 await w.eval('Shots.record()');L('clip frames',w.eval('document.getElementById("clipscrub").max')*1+1,'clipbar shown',!d.getElementById('clipbar').hidden);
 w.eval('Shots.show(2)');await sleep(50);tile('clip frame 2');
 L('DONE');
};
</script></body>
