<!doctype html><base href="../"><body style="margin:0;background:#333"><pre id=o style="color:#0f0;font:12px monospace;margin:0"></pre><div id=g style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:8px"></div><iframe id=f src="index.html" width=10 height=10 style="position:absolute;left:-99px"></iframe><script>
document.getElementById('f').onload=async()=>{try{await new Promise(r=>setTimeout(r,800));const w=document.getElementById('f').contentWindow,M=w.eval('Make'),P=w.eval('Prt'),L=t=>document.getElementById('o').textContent+=t+'\n';
 M.show('gift');const d=M.panels.gift,v=n=>d.querySelector('[name='+n+']');
 const run=(label,set)=>{set();const r=M.KINDS.gift.build(d,v);L(label+': '+r.h+' dots = '+(r.h/80).toFixed(1)+' cm');const c=P.bitsCanvas(r.bits);c.style.cssText='background:#fff;width:'+(r.h>700?'260px':'300px');document.getElementById('g').appendChild(c)};
 run('holly/tree x3',()=>{v('border').value='holly';v('icon').value='tree';v('layout').value='tall'});
 run('snow/snowman',()=>{v('to').value='Aunt Wilhelmina Featherstonehaugh';v('border').value='snow';v('icon').value='snowman'});
 run('cane stripes/present',()=>{v('to').value='Max | Santa';v('border').value='cane';v('icon').value='present'});
 run('wide holly/bauble',()=>{v('to').value='Grandma';v('border').value='holly';v('icon').value='bauble';v('layout').value='wide'});
 run('wide plain/cane+star',()=>{v('to').value='Uncle Joe';v('border').value='plain';v('icon').value='cane';v('layout').value='wide'});
 run('tall plain/star',()=>{v('to').value='Maya';v('border').value='plain';v('icon').value='star';v('layout').value='tall'});
 L('DONE')}catch(e){document.getElementById('o').textContent+='FATAL '+e.message+'\n'+e.stack}};
</script></body>
