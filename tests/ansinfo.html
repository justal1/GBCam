<!doctype html><base href="../"><body style="margin:0;background:#222"><pre id=o style="color:#0f0;font:12px monospace;margin:0"></pre><script>
const L=t=>document.getElementById('o').textContent+=t+'\n';const sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{const f=document.createElement('iframe');f.src='index.html';f.width=420;f.height=900;f.style.border=0;document.body.appendChild(f);await new Promise(r=>f.onload=r);await sleep(900);
 const w=f.contentWindow,d=w.document,M=w.eval('Make');d.getElementById('tabmk').click();M.show('ansi');await sleep(1200);const p=M.panels.ansi,meta=()=>d.getElementById('mkmeta').textContent;
 const art=p.querySelector('[name=art]');art.value='nfo';art.dispatchEvent(new w.Event('change',{bubbles:true}));art.dispatchEvent(new w.Event('input',{bubbles:true}));await sleep(1500);
 L('NFO selected -> dir='+p.querySelector('[name=dir]').value+' look='+p.querySelector('[name=look]').value+' | '+meta());
 art.value='bbs';art.dispatchEvent(new w.Event('change',{bubbles:true}));await sleep(1500);L('BBS selected -> dir='+p.querySelector('[name=dir]').value+' look='+p.querySelector('[name=look]').value+' | '+meta());
 // open the sample .nfo through the file input
 const bytes=new Uint8Array(await (await fetch('sample.nfo')).arrayBuffer()),dt=new w.DataTransfer();dt.items.add(new w.File([bytes],'release.nfo'));const inp=p.querySelector('[name=file]');inp.files=dt.files;inp.dispatchEvent(new w.Event('change'));await sleep(1800);
 L('opened release.nfo -> art='+art.value+' dir='+p.querySelector('[name=dir]').value+' look='+p.querySelector('[name=look]').value+' | '+meta()+' | '+p.querySelector('[name=fname]').textContent);
 M.show('gift');await sleep(900);L('gift preview: '+meta()+' err='+(d.getElementById('mkerr').hidden?'none':d.getElementById('mkerr').textContent));L('DONE')})().catch(e=>L('FATAL '+e.message+e.stack));
</script></body>
