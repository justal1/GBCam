<!doctype html><base href="../"><meta charset="utf-8"><body style="margin:0;background:#222;color:#fff;font:11px monospace"><pre id=lg style="margin:0;height:200px;overflow:hidden"></pre><iframe id=f src="index.html" width=420 height=1200 style="border:0"></iframe><script>
const f=document.getElementById('f'),sleep=ms=>new Promise(r=>setTimeout(r,ms));

f.onload=async()=>{const L=(...a)=>{console.log('T:',...a);document.getElementById('lg').textContent+=a.join(' ')+'\n'},w=f.contentWindow,d=w.document;await sleep(1200);
 d.getElementById('tabgb').click();await sleep(300);
 const rom=new Uint8Array(await (await fetch('rom/camera.gb')).arrayBuffer());

 for(let i=0;i<100&&!(w.gbui.gb&&w.gbui.gb.cameraSource&&w.gbui.gb.cameraColour);i++)await sleep(50);await sleep(300);w.eval("tab='cam'");const gb=w.gbui.gb;L('mapper',gb.mbc);

 for(let y=0;y<112;y++)for(let x=0;x<128;x++){let r,g,b;if(y>78){r=40;g=150;b=60}else{r=60+y;g=120+y;b=235-y}
   if(Math.hypot(x-64,y-48)<22){r=240;g=60;b=50}if(x>100&&y<30&&Math.hypot(x-110,y-18)<9){r=255;g=220;b=40}
   const i=y*128+x;C[i*4]=r;C[i*4+1]=g;C[i*4+2]=b;C[i*4+3]=255;S[i]=0.299*r+0.587*g+0.114*b}
 const run=n=>{for(let i=0;i<n;i++)gb.runFrame();w.gbui.drawFrame()};

 L('cameraSource set',typeof gb.cameraSource,gb.cameraSource&&gb.cameraSource()===S,'same gb as gbui',gb===w.gbui.gb,'S[0..3]',S[0],S[5000],S[12000],'camRGB',!!gb.camRGB,'camIds',!!gb.camIds);
 run(1);w.gbui.drawFrame();L('place after',JSON.stringify(w.gbui.place));
 L('DONE')};
