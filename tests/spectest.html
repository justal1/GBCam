<!doctype html><base href="../"><body style="margin:0;background:#333"><pre id=o style="color:#0f0;font:12px monospace;margin:0"></pre><div id=g style="display:flex;gap:8px;flex-wrap:wrap;padding:6px"></div>
<script src="spectrum/z80.js"></script><script src="spectrum/basic.js"></script><script src="spectrum/spectrum.js"></script><script>
(async()=>{const L=t=>{document.getElementById('o').textContent+=t+'\n';fetch('http://127.0.0.1:8802/log?'+encodeURIComponent(t)).catch(()=>{})};
 try{
 const rom=new Uint8Array(await (await fetch('spectrum/48.rom')).arrayBuffer()),sp=new Spectrum(rom);
 const show=(name,bw=16)=>{const W=256+2*bw,H=192+2*bw,c=document.createElement('canvas');c.width=W;c.height=H;c.style.cssText='width:'+W*1.4+'px;image-rendering:pixelated';const x=c.getContext('2d'),im=x.createImageData(W,H);sp.draw(im,bw);x.putImageData(im,0,0);const d=document.createElement('div');d.style.cssText='color:#fff;font:11px monospace';d.appendChild(c);d.append(name);document.getElementById('g').appendChild(d)};
 const frames=n=>{for(let i=0;i<n;i++)sp.runFrame()};
 const press=(keys,hold=4,gap=4)=>{for(const k of keys){const [r,b]=Spectrum.MATRIX[k];sp.setKey(r,b,true)}frames(hold);for(const k of keys){const [r,b]=Spectrum.MATRIX[k];sp.setKey(r,b,false)}frames(gap)};
 frames(150);show('after boot (expect (C) 1982 Sinclair Research Ltd)');
 const txt=sp.mem.slice(0x5800,0x5800+16).join(',');L('PC='+sp.cpu.pc.toString(16)+' SP='+sp.cpu.sp.toString(16)+' attrs '+txt);
 // PRINT "HELLO"
 press(['P']);press(['SYM','P']);for(const k of ['H','E','L','L','O'])press([k]);press(['SYM','P']);press(['ENTER']);frames(20);show('PRINT "HELLO"');
 // COPY -> printer hook
 let printed=null;sp.onPrint=(page,kind)=>{printed={w:page.w,h:page.h,ink:page.bits.reduce((a,b)=>a+b,0),kind}};
 press(['Z']);press(['ENTER']);frames(20);L('COPY -> '+JSON.stringify(printed));
 // LPRINT "HI"
 let lines=[];sp.onPrint=(page,kind)=>lines.push(kind+':'+page.h+':'+page.bits.reduce((a,b)=>a+b,0));
 // LPRINT is the key on 'C'? use keyword via extended: type  L P R I N T letters not needed -> use LLIST later
 // tape: flag program
 const src=await (await fetch('spectrum/flag.bas')).text(),tap=ZXBasic.programTape('flag',src,-1);L('flag tokenised: '+tap[1].length+' bytes; blocks '+tap.map(b=>b.length).join('+')+'; listing check: '+ZXBasic.list(tap[1].slice(1,tap[1].length-1)).split('\n').slice(0,4).join(' | '));
 sp.insert(tap);
 press(['J']);press(['SYM','P']);press(['SYM','P']);press(['ENTER']);frames(60);show('after LOAD ""');
 L('tape pos '+sp.tape.pos+'/'+sp.tape.blocks.length);
 press(['R']);press(['ENTER']);let n=0;while(n<3000){frames(1);n++;if(n%100===0){}}show('flag after 3000 frames (60s)');
 sp.onPrint=(page,kind)=>{printed={w:page.w,h:page.h,ink:page.bits.reduce((a,b)=>a+b,0),kind};const cc=document.createElement('canvas');cc.width=page.w;cc.height=page.h;const cx=cc.getContext('2d'),im=cx.createImageData(page.w,page.h);for(let i=0;i<page.w*page.h;i++){const v=page.bits[i]?0:255;im.data.set([v,v,v,255],i*4)}cx.putImageData(im,0,0);cc.style.cssText='background:#fff;width:384px;image-rendering:pixelated';document.getElementById('g').appendChild(cc)};
 press(['Z']);press(['ENTER']);frames(20);L('flag COPY -> '+JSON.stringify(printed));
 // SAVE trap: SAVE "t"
 let saved=[];sp.onSave=(b)=>saved.push(b.length);press(['S']);press(['SYM','P']);press(['T']);press(['SYM','P']);press(['ENTER']);frames(30);press(['SPACE']);frames(60);L('SAVE -> blocks recorded '+sp.recorded.length+' ('+saved.join(',')+')');
 L('DONE')}catch(e){L('FATAL '+e.message+'\n'+e.stack)}})();
</script></body>
