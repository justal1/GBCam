<!doctype html><body style="margin:0;background:#333"><pre id=o style="color:#0f0;font:12px monospace;margin:0"></pre><div id=g style="display:flex;gap:10px;padding:6px;align-items:flex-start"></div><iframe id=f src="index.html" width=10 height=10 style="position:absolute;left:-99px"></iframe><script>
const L=t=>{document.getElementById('o').textContent+=t+'\n';fetch('http://127.0.0.1:8802/log?'+encodeURIComponent(t)).catch(()=>{})};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('f').onload=async()=>{try{await sleep(900);const w=document.getElementById('f').contentWindow,d=w.document,M=w.eval('Make'),P=w.eval('Prt');
 d.getElementById('tabmk').click();M.show('flash');const p=M.panels.flash,q=n=>p.querySelector('[name='+n+']');
 q('q').value='Volcanoes';q('n').value='4';q('go').click();
 for(let i=0;i<60&&!p.querySelectorAll('.fcrow').length;i++)await sleep(250);
 L('found: '+[...p.querySelectorAll('.fcrow')].map(e=>e.textContent.trim()).join(' | ')+' status='+q('status').textContent);
 for(const style of ['fact','quiz']){q('style').value=style;const t0=Date.now();const r=await M.KINDS.flash.build(p,n=>q(n));const c=P.bitsCanvas(r.bits);c.style.cssText='background:#fff;width:300px';const cell=document.createElement('div');cell.style.cssText='color:#fff;font:10px monospace';cell.appendChild(c);cell.append(style+' '+r.h+' dots '+(Date.now()-t0)+'ms');document.getElementById('g').appendChild(cell);L(style+': '+r.h+' dots')}
 // exact titles
 q('find').value='titles';q('q').value='Mount Vesuvius\nKrakatoa\nNotAnArticleXyzzy';q('go').click();await sleep(2500);L('exact: '+[...p.querySelectorAll('.fcrow')].map(e=>e.textContent.trim()).join(' | '));
 L('DONE')}catch(e){L('FATAL '+e.message+'\n'+e.stack)}};
</script></body>
