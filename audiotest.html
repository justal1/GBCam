<!doctype html><meta charset="utf-8"><body style="background:#333"><div id=o></div><script src="gb.js"></script><script>
(async()=>{
 const L=(...a)=>console.log('T:',...a);
 const rom=new Uint8Array(await (await fetch('rom/camera.gb')).arrayBuffer());

 gb.apu.on=true;gb.apu.sampleCycles=4194304/48000;
 let peak=0,nz=0,nan=0,sumsq=0,n=0;const L1=new Float32Array(1024),R1=new Float32Array(1024);

 L('samples',n,'nonzero',nz,'peak',peak.toFixed(3),'rms',Math.sqrt(sumsq/n).toFixed(4),'nan',nan,'NR52',gb.apu.read(0x26).toString(16),'NR50',gb.apu.nr50.toString(16),'NR51',gb.apu.nr51.toString(16));
