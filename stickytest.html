<!doctype html><body style="margin:0;background:#222;display:flex;gap:6px"><div id=o style="color:#0f0;font:11px monospace;width:200px"></div>
<iframe id=a src="index.html" width=390 height=800 style="border:0"></iframe><iframe id=b src="index.html?b" width=390 height=800 style="border:0"></iframe><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const L=t=>document.getElementById('o').textContent+=t+'\n';
const setup=async(id,tabName,scroll)=>{const f=document.getElementById(id);await new Promise(r=>f.onload=r);await sleep(700);const w=f.contentWindow,d=w.document;
 d.getElementById(tabName).click();await sleep(200);
 const c=d.getElementById('view'),x=c.getContext('2d');const g=x.createLinearGradient(0,0,384,336);g.addColorStop(0,'#f6c');g.addColorStop(1,'#36f');x.fillStyle=g;x.fillRect(0,0,384,336);d.getElementById('hint').style.display='none';
 w.scrollTo(0,scroll);await sleep(200);const r=d.getElementById('stage').getBoundingClientRect(),b=d.getElementById('shutter').getBoundingClientRect(),vh=w.innerHeight;L(id+' '+tabName+' scrollY='+Math.round(w.scrollY)+'/'+d.documentElement.scrollHeight+' stage top='+Math.round(r.top)+' shutter top='+Math.round(b.top)+' bottom='+Math.round(b.bottom)+' of '+vh+' onscreen='+(b.top>=0&&b.bottom<=vh))};
(async()=>{await Promise.all([setup('a','tabcam',99999),setup('b','tabfx',1500)]);
 const w=document.getElementById('a').contentWindow,d=w.document;const b0={x:0,y:0};d.getElementById('tabmk').click();await sleep(200);L('make tab: dock hidden='+d.getElementById('camdock').hidden);d.getElementById('tabcam').click();await sleep(100);w.scrollTo(0,500);await sleep(100);{const bb=d.getElementById('shutter').getBoundingClientRect();b0.x=bb.left+bb.width/2;b0.y=bb.top+bb.height/2}L('back to cam: dock hidden='+d.getElementById('camdock').hidden+' shutter clickable='+(d.elementFromPoint(b0.x,b0.y)===d.getElementById('shutter')));L('DONE')})();
</script></body>
