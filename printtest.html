<!doctype html><body style="margin:0;background:#333"><pre id=o style="color:#0f0;font:12px monospace;margin:0"></pre><div id=g style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;padding:6px"></div><iframe id=f src="index.html" width=10 height=10 style="position:absolute;left:-99px"></iframe><script>
document.getElementById('f').onload=async()=>{try{await new Promise(r=>setTimeout(r,800));const w=document.getElementById('f').contentWindow,M=w.eval('Make'),P=w.eval('Prt'),L=t=>{document.getElementById('o').textContent+=t+'\n';fetch('http://127.0.0.1:8802/log?'+encodeURIComponent(t)).catch(()=>{})};
 const jobs=[['party','bingo'],['party','bingo:words'],['party','scavenger'],['party','secret'],['party','secret:morse'],['party','wheel'],['party','raffle'],['party','invite'],['labels','pantry'],['labels','cable'],['labels','plant'],['labels','recipe'],['labels','ruler'],['planner','month'],['planner','week'],['planner','day'],['planner','habits'],['planner','meals']];
 for(const [kind,spec] of jobs){const [what,sub]=spec.split(':');M.show(kind);const d=M.panels[kind],q=n=>d.querySelector('[name='+n+']');q('what').value=what;q('what').dispatchEvent(new w.Event('change',{bubbles:true}));if(sub==='words')q('bingo_mode').value='words';if(sub==='morse')q('sec_cipher').value='morse';
  try{const r=M.KINDS[kind].build(d);const c=P.bitsCanvas(r.bits);c.style.cssText='background:#fff;width:190px';const cell=document.createElement('div');cell.style.cssText='color:#fff;font:10px monospace;width:190px';cell.appendChild(c);cell.append(spec+' '+(r.h/80).toFixed(1)+'cm');document.getElementById('g').appendChild(cell);L(spec+': ok '+r.h+' dots')}catch(e){L(spec+': ERROR '+e.message+' '+(e.stack||'').split('\n')[1])}}
 L('DONE')}catch(e){document.getElementById('o').textContent+='FATAL '+e.message+'\n'+e.stack}};
</script></body>
