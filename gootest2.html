<!doctype html><body style="margin:0;background:#222;color:#0f0;font:12px monospace"><pre id=o></pre><div id=g style="display:flex;flex-wrap:wrap;gap:4px"></div><iframe id=f src="index.html" width=420 height=900 style="border:0"></iframe><script>
const L=t=>document.getElementById('o').textContent+=t+'\n';
document.getElementById('f').onload=async()=>{try{await new Promise(r=>setTimeout(r,900));
 const w=document.getElementById('f').contentWindow,d=w.document,Fx=w.eval('Fx'),G=Fx.goo;
 const sc=document.createElement('canvas');sc.width=384;sc.height=336;const g=sc.getContext('2d');
 const bg=g.createLinearGradient(0,0,384,336);bg.addColorStop(0,'#8fb7d9');bg.addColorStop(1,'#35506b');g.fillStyle=bg;g.fillRect(0,0,384,336);
 g.fillStyle='#e8b896';g.beginPath();g.ellipse(192,190,85,112,0,0,7);g.fill();g.fillStyle='#4a2f1d';g.beginPath();g.ellipse(192,100,92,48,0,0,7);g.fill();
 g.fillStyle='#fff';for(const x of [160,224]){g.beginPath();g.ellipse(x,175,17,10,0,0,7);g.fill();}g.fillStyle='#222';for(const x of [160,224]){g.beginPath();g.arc(x,175,6,0,7);g.fill();}
 g.strokeStyle='#8a3b3b';g.lineWidth=5;g.beginPath();g.arc(192,230,28,0.2,2.9);g.stroke();
 Fx.st.name='goo';
 const show=(name)=>{const c=document.createElement('canvas');c.width=384;c.height=336;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(sc,0,0);Fx.apply(x);c.style.width='192px';const cell=document.createElement('div');cell.style.color='#fff';cell.appendChild(c);cell.append(name);document.getElementById('g').appendChild(cell);return c};
 const reset=()=>{G.fx.fill(0);G.fy.fill(0);G.ripples=[];G.down=false;G.wob=0};
 const drag=(a,b)=>{G.tool='smear';G.px=a[0];G.py=a[1];for(let i=1;i<=12;i++){const x=a[0]+(b[0]-a[0])*i/12,y=a[1]+(b[1]-a[1])*i/12;w.eval('0');/*smear fn via synthetic events below*/}};
 // use real pointer events on the view (fx tab)
 d.getElementById('tabfx').click();d.querySelector('#fxgrid button[data-k=goo]').click();
 const view=d.getElementById('view');const R=view.getBoundingClientRect();L('view rect '+Math.round(R.width)+'x'+Math.round(R.height)+' panel hidden='+d.getElementById('fxgoo').hidden);
 const ev=(type,x,y)=>view.dispatchEvent(new w.PointerEvent(type,{clientX:R.left+x/384*R.width,clientY:R.top+y/336*R.height,pointerId:1,buttons:type==='pointerup'?0:1,bubbles:true}));
 const stroke=async(a,b)=>{ev('pointerdown',a[0],a[1]);for(let i=1;i<=14;i++){ev('pointermove',a[0]+(b[0]-a[0])*i/14,a[1]+(b[1]-a[1])*i/14)}ev('pointerup',b[0],b[1])};
 const dstroke=async(a,b)=>{ev('pointerdown',a[0],a[1]);for(let i=1;i<=18;i++){ev('pointermove',a[0]+(b[0]-a[0])*i/18,a[1]+(b[1]-a[1])*i/18)}ev('pointerup',b[0],b[1])};
 const resetAll=()=>{d.getElementById('goo-reset').click();G.undo.length=0};
 resetAll();G.tool='scatter';G.size=70;ev('pointerdown',192,190);for(let i=0;i<14;i++)await new Promise(r=>setTimeout(r,40));ev('pointerup',192,190);L('scatter: on='+G.scatOn+' max='+G.scat.reduce((a,b)=>Math.max(a,b),0).toFixed(2));show('scatter');
 resetAll();G.tool='paint';G.rainbow=true;await dstroke([100,230],[290,230]);L('paint: hasPaint='+G.hasPaint+' drips='+G.drips.length);show('goo paint + drips (start)');
 for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,60))}L('drips after wait='+G.drips.length);show('after drips ran');
 G.tool='smear';await dstroke([190,230],[240,160]);show('paint smeared');
 d.getElementById('goo-col').value='#22aa55';d.getElementById('goo-col').dispatchEvent(new Event('input'));G.tool='paint';G.dripsOn=false;await dstroke([120,120],[260,120]);show('picked colour (green)');
 G.tool='restore';G.size=150;ev('pointerdown',192,200);for(let i=0;i<20;i++)await new Promise(r=>setTimeout(r,40));ev('pointerup',192,200);show('restore wiped centre');
 d.getElementById('goo-undo').click();L('undo restored paint='+G.hasPaint);
 resetAll();L('after reset paint='+G.hasPaint+' scat='+G.scatOn);
 L('DONE');}catch(e){L('FATAL '+e.message+e.stack)}};
</script></body>
