<!doctype html><body style="margin:0;background:#222"><pre id=o style="color:#0f0;font:12px monospace"></pre><iframe id=f src="index.html" width=420 height=1500 style="border:0"></iframe><script>
const L=t=>document.getElementById('o').textContent+=t+'\n';
document.getElementById('f').onload=async()=>{try{await new Promise(r=>setTimeout(r,900));
 const w=document.getElementById('f').contentWindow,d=w.document,M=w.eval('Make');
 // fake rear camera showing a QR code on a table
 const src=M.qrCanvas('https://example.com/hello?from=catcam',300).canvas;
 const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d');
 const draw=()=>{x.fillStyle='#b9a98a';x.fillRect(0,0,640,480);x.drawImage(src,170,60,300,300);requestAnimationFrame(draw)};draw();
 const vid=w.eval('video');vid.srcObject=c.captureStream(20);await vid.play();L('fake camera '+vid.videoWidth+'x'+vid.videoHeight+' BarcodeDetector='+('BarcodeDetector' in w));
 d.getElementById('tabmk').click();M.show('scan');
 for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,250));const f=d.querySelector('[name=found]');if(f&&!f.hidden)break}
 const q=n=>d.querySelector('.mkcard[data-kind=scan] [name='+n+']');
 L('found hidden='+q('found').hidden+' text='+q('res').value+' open btn hidden='+q('open').hidden);
 L('status: '+q('stat').textContent);
 await new Promise(r=>setTimeout(r,600));
 const pc=d.querySelector('#mkpaper canvas');L('preview '+(pc?pc.width+'x'+pc.height:'none')+' meta='+d.getElementById('mkmeta').textContent);
 L('history buttons='+d.querySelectorAll('[name=hist] button').length);
 L('DONE');}catch(e){L('FATAL '+e.message+e.stack)}};
</script></body>
