<!doctype html><body style="margin:0;background:#333"><pre id=o style="color:#0f0;font:12px monospace;margin:0"></pre><div id=g style="display:flex;gap:10px;align-items:flex-start;padding:8px"></div><iframe id=f src="index.html" width=10 height=10 style="position:absolute;left:-99px"></iframe><script>
document.getElementById('f').onload=async()=>{try{await new Promise(r=>setTimeout(r,800));const w=document.getElementById('f').contentWindow,M=w.eval('Make'),P=w.eval('Prt'),O=w.eval('Overlay'),L=t=>document.getElementById('o').textContent+=t+'\n';
 // synthetic photo as dithered bits
 const sc=document.createElement('canvas');sc.width=384;sc.height=336;const g=sc.getContext('2d');const bg=g.createLinearGradient(0,0,384,336);bg.addColorStop(0,'#ddd');bg.addColorStop(1,'#555');g.fillStyle=bg;g.fillRect(0,0,384,336);
 g.fillStyle='#e8b896';g.beginPath();g.ellipse(192,190,85,112,0,0,7);g.fill();g.fillStyle='#222';g.beginPath();g.ellipse(192,100,92,48,0,0,7);g.fill();g.fillStyle='#fff';for(const x of [160,224]){g.beginPath();g.ellipse(x,175,17,10,0,0,7);g.fill()}g.fillStyle='#000';for(const x of [160,224]){g.beginPath();g.arc(x,175,6,0,7);g.fill()}g.strokeStyle='#722';g.lineWidth=5;g.beginPath();g.arc(192,230,28,0.2,2.9);g.stroke();
 const d=g.getImageData(0,0,384,336).data,bits=new Uint8Array(384*336),B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];for(let y=0;y<336;y++)for(let x=0;x<384;x++){const i=y*384+x,l=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;bits[i]=l<(B[(y&3)*4+(x&3)]+0.5)/16?1:0}
 w.eval('lastBits=null');const lb=w.eval('lastBits=new Uint8Array(384*336)');lb.set(bits);
 M.show('wanted');const dd=M.panels.wanted,v=n=>dd.querySelector('[name='+n+']');
 const cases=[['BIG ALEX','Stealing the last biscuit','$5,000','LAST SEEN NEAR THE FRIDGE'],['Christopher Robinson-Smith','Supercalifragilisticexpialidocious behaviour at the dinner table, repeatedly, on purpose, for years and years','$1,000,000,000','ALIVE AND UNHARMED'],['Al','x','$1','VERY DANGEROUS']];
 for(const [nm,cr,rw,tg] of cases){v('name').value=nm;v('crime').value=cr;v('reward').value=rw;v('tag').value=tg;const r=M.KINDS.wanted.build(dd,v);L(nm+': '+r.h+' dots');const c=P.bitsCanvas(r.bits);c.style.cssText='background:#fff;width:300px';document.getElementById('g').appendChild(c)}
 M.show('badge');{const bd=M.panels.badge,bv=n=>bd.querySelector('[name='+n+']');for(const [nm,sb] of [['Al','Chief snack officer and bedtime negotiator'],['MAYA','Chief snack officer']]){bv('name').value=nm;bv('sub').value=sb;bv('orient').value='side';bv('style').value='band';const r=M.KINDS.badge.build(bd,bv);L('badge '+nm+': '+r.h);const c=P.bitsCanvas(r.bits);c.style.cssText='background:#fff;height:420px';document.getElementById('g').appendChild(c)}}
 // the Fun-tab frame
 O.st.frame='wanted';O.st.caption='Maya';const fc=document.createElement('canvas');fc.width=384;fc.height=336;const fx=fc.getContext('2d');fx.drawImage(sc,0,0);O.apply(fx);fc.style.cssText='width:300px;background:#fff';document.getElementById('g').appendChild(fc);L('frame ok');O.st.frame='none';O.st.caption='';
}catch(e){document.getElementById('o').textContent+='FATAL '+e.message+' '+e.stack.split('\n')[1]}};</script></body>
